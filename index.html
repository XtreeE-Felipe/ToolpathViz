<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Toolpath Viewer (v2)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #viewer {
            flex: 1;
            position: relative;
            background: #0a0a0a;
        }

        #sidebar {
            width: 350px;
            background: #252525;
            overflow-y: auto;
            padding: 20px;
            border-left: 1px solid #333;
        }

        #upload-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 40px;
            border: 3px dashed #555;
            border-radius: 12px;
            background: rgba(37, 37, 37, 0.9);
            cursor: pointer;
            transition: all 0.3s;
            z-index: 10;
        }

        #upload-zone:hover {
            border-color: #4a9eff;
            background: rgba(74, 158, 255, 0.1);
        }

        #upload-zone.hidden {
            display: none;
        }

        #upload-zone h2 {
            margin-bottom: 10px;
            color: #4a9eff;
        }

        #upload-zone p {
            color: #888;
        }

        input[type="file"] {
            display: none;
        }

        .metadata-section {
            margin-bottom: 25px;
        }

        .metadata-section h3 {
            color: #4a9eff;
            margin-bottom: 12px;
            font-size: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .metadata-item:last-child {
            border-bottom: none;
        }

        .metadata-label {
            color: #aaa;
            font-size: 13px;
        }

        .metadata-value {
            color: #fff;
            font-weight: 500;
            font-size: 13px;
            text-align: right;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(37, 37, 37, 0.9);
            padding: 15px;
            border-radius: 8px;
            z-index: 5;
        }

        #controls button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin-right: 8px;
        }

        #controls button:hover {
            background: #357abd;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4a9eff;
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="viewer">
            <div id="upload-zone">
                <h2>📁 Upload Toolpath JSON</h2>
                <p>Drag and drop your file here or click to browse</p>
                <input type="file" id="file-input" accept=".json">

                <div style="margin: 20px 0; border-top: 1px solid #555; padding-top: 20px;">
                    <p style="margin-bottom: 10px; font-size: 14px; color: #aaa;">OR select a sample:</p>
                    <select id="sample-select"
                        style="background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; width: 100%;">
                        <option value="">-- Select a Sample --</option>
                    </select>
                </div>
            </div>
            <div id="controls" class="hidden">
                <button id="reset-view">Reset View</button>
                <button id="reload-file">Load New File</button>
            </div>
        </div>
        <div id="sidebar">
            <h2 style="margin-bottom: 20px; color: #4a9eff;">Toolpath Data</h2>

            <div class="metadata-section">
                <h3>Visualization</h3>
                <div class="metadata-item">
                    <label for="color-by-select" class="metadata-label" style="color: #eee; font-weight: 500;">Color
                        By:</label>
                </div>
                <select id="color-by-select"
                    style="width: 100%; padding: 8px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; font-size: 14px; margin-top: 8px;">
                    <option value="layer">Default</option>
                </select>
            </div>

            <div id="metadata-container">
                <p style="color: #888; text-align: center;">No file loaded</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        let scene, camera, renderer, controls, toolpathGroup;
        let uploadZone = document.getElementById('upload-zone');
        let fileInput = document.getElementById('file-input');
        let viewerDiv = document.getElementById('viewer');
        let metadataContainer = document.getElementById('metadata-container');
        let controlsDiv = document.getElementById('controls');
        let colorBySelect = document.getElementById('color-by-select');

        let currentToolpathData = null; // Store the loaded data
        let currentMinMax = { min: 0, max: 1 }; // Store min/max for current gradient

        // Initialize Three.js scene
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            camera = new THREE.PerspectiveCamera(
                35,
                viewerDiv.clientWidth / viewerDiv.clientHeight,
                0.1,
                10000
            );
            camera.position.set(500, 500, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            viewerDiv.appendChild(renderer.domElement);

            // Setup OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 10;
            controls.maxDistance = 5000;
            controls.target.set(0, 0, 0);
            controls.update();

            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 100);
            scene.add(directionalLight);

            // Grid helper
            const gridHelper = new THREE.GridHelper(400, 40, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Axes helper
            const axesHelper = new THREE.AxesHelper(100);
            scene.add(axesHelper);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Helper Functions ---

        function populateColorByOptions(data) {
            colorBySelect.innerHTML = '<option value="layer">Default</option>';
            const toolpath = data.Toolpath;
            if (!toolpath) return;
            const firstLayerKey = Object.keys(toolpath)[0];
            if (!firstLayerKey) return;
            const firstLayer = toolpath[firstLayerKey];
            const potentialVariables = Object.keys(firstLayer);

            potentialVariables.forEach(key => {
                if (key !== 'Positions' && Array.isArray(firstLayer[key]) && firstLayer[key].length === firstLayer.Positions.length) {
                    const option = document.createElement('option');
                    option.value = key;
                    option.textContent = `Variable: ${key}`;
                    colorBySelect.appendChild(option);
                }
            });
        }

        function getMinMax(toolpath, dataKey) {
            let min = Infinity;
            let max = -Infinity;
            Object.values(toolpath).forEach(layer => {
                const dataArray = layer[dataKey];
                if (dataArray && Array.isArray(dataArray)) {
                    for (let i = 1; i < dataArray.length; i++) {
                        const value = dataArray[i];
                        if (value < min) min = value;
                        if (value > max) max = value;
                    }
                }
            });
            if (min === max) return { min: min - 0.5, max: max + 0.5 };
            return { min, max };
        }

        function getColorFromGradient(value, min, max) {
            if (min === max) return new THREE.Color().setHSL(0.7, 0.56, 0.45);
            const normalized = (value - min) / (max - min);
            const hue = (1.0 - normalized) * 0.66;
            return new THREE.Color().setHSL(hue, 1.0, 0.5);
        }

        // --- Visualization Logic (Single Polyline) ---

        function visualizeToolpath(colorByKey = 'layer') {
            if (!currentToolpathData) return;

            const data = currentToolpathData;

            if (toolpathGroup) {
                scene.remove(toolpathGroup);
            }

            toolpathGroup = new THREE.Group();
            const toolpath = data.Toolpath;

            if (colorByKey !== 'layer') {
                currentMinMax = getMinMax(toolpath, colorByKey);
            }

            const allPositions = [];
            const allColors = [];

            // Sort layer keys (0, 1, 2...)
            const sortedKeys = Object.keys(toolpath).sort((a, b) => {
                const numA = parseInt(a.replace(/[^0-9]/g, ''));
                const numB = parseInt(b.replace(/[^0-9]/g, ''));
                return numA - numB;
            });

            // Iterate through all layers
            sortedKeys.forEach((layerKey, layerIndex) => {
                const layer = toolpath[layerKey];
                const positions = layer.Positions;
                const variableData = layer[colorByKey];

                if (!positions || positions.length === 0) return;

                for (let i = 0; i < positions.length; i++) {
                    const [x, y, z] = positions[i].split(',').map(Number);
                    allPositions.push(x, z, -y); // Swap Y and Z, negate Y to fix mirroring

                    let color;
                    if (colorByKey === 'layer' || !Array.isArray(variableData)) {
                        const hue = 0.55;
                        color = new THREE.Color().setHSL(hue, 1, 0.45);
                    } else {
                        const value = variableData[i];
                        color = getColorFromGradient(value, currentMinMax.min, currentMinMax.max);
                    }
                    allColors.push(color.r, color.g, color.b);
                }
            });

            if (allPositions.length === 0) return;

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(allPositions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(allColors, 3));

            const material = new THREE.LineBasicMaterial({ vertexColors: true });
            const line = new THREE.Line(geometry, material);

            toolpathGroup.add(line);
            scene.add(toolpathGroup);

            // Recenter camera if this is the default view
            if (colorByKey === 'layer') {
                const box = new THREE.Box3().setFromObject(toolpathGroup);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);

                // Distance Multiplier 2.5
                const fov = camera.fov * (Math.PI / 180);
                const cameraDistance = (maxDim / 2 / Math.tan(fov / 2)) * 2.5;

                camera.position.set(center.x + cameraDistance, center.y + cameraDistance / 2, center.z + cameraDistance);

                if (controls) {
                    controls.target.copy(center);
                    controls.update();
                } else {
                    camera.lookAt(center);
                }
            }
        }

        function displayMetadata(data) {
            let html = '';
            if (data.ObjectInfo) {
                html += '<div class="metadata-section"><h3>Object Information</h3>';
                Object.entries(data.ObjectInfo).forEach(([key, value]) => {
                    html += `<div class="metadata-item"><span class="metadata-label">${key}</span><span class="metadata-value">${value}</span></div>`;
                });
                html += '</div>';
            }
            if (data.AnalysisData) {
                html += '<div class="metadata-section"><h3>Analysis Data</h3>';
                Object.entries(data.AnalysisData).forEach(([key, value]) => {
                    html += `<div class="metadata-item"><span class="metadata-label">${key}</span><span class="metadata-value">${value}</span></div>`;
                });
                html += '</div>';
            }
            if (data.ToolpathDataRange) {
                html += '<div class="metadata-section"><h3>Toolpath Data Range</h3>';
                Object.entries(data.ToolpathDataRange).forEach(([key, value]) => {
                    html += `<div class="metadata-item"><span class="metadata-label">${key}</span><span class="metadata-value">${value}</span></div>`;
                });
                html += '</div>';
            }
            const layerCount = Object.keys(data.Toolpath || {}).length;
            html += `<div class="metadata-section"><h3>Toolpath Summary</h3><div class="metadata-item"><span class="metadata-label">Total Layers</span><span class="metadata-value">${layerCount}</span></div></div>`;
            metadataContainer.innerHTML = html;
        }

        // --- File Handling ---

        // List of available files in /data
        const sampleFiles = [
            "ScreenBase_v0_044902894.json",
            "S_Mur_2_v0_089206760.json",
            "ProtoFolie_v1_070908868.json",
            "LargeScalePrototype_v1_075728131.json",
            "FieldsColumn_v3_069786330.json"
        ];

        const sampleSelect = document.getElementById('sample-select');

        // Populate dropdown
        sampleFiles.forEach(fileName => {
            const option = document.createElement('option');
            option.value = fileName;
            option.textContent = fileName;
            sampleSelect.appendChild(option);
        });

        // Central data loader
        function loadToolpathData(jsonContent) {
            try {
                currentToolpathData = jsonContent;
                populateColorByOptions(currentToolpathData);
                visualizeToolpath('layer');
                displayMetadata(currentToolpathData);
                uploadZone.classList.add('hidden');
                controlsDiv.classList.remove('hidden');
            } catch (error) {
                alert('Error processing toolpath data: ' + error.message);
                currentToolpathData = null;
            }
        }

        // Helper to fetch sample file
        function fetchSampleFile(fileName) {
            fetch(`./data/${fileName}`)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(json => {
                    loadToolpathData(json);
                })
                .catch(error => {
                    alert('Error loading sample file: ' + error.message + '\n\n(Make sure you are running this on a local server, not opening the file directly)');
                    sampleSelect.value = "";
                });
        }

        // Handle local file upload
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    loadToolpathData(json);
                } catch (error) {
                    alert('Error parsing JSON file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // --- Event Listeners ---

        // 1. Handle Deep Linking on Load
        const urlParams = new URLSearchParams(window.location.search);
        const fileParam = urlParams.get('file');
        if (fileParam && sampleFiles.includes(fileParam)) {
            sampleSelect.value = fileParam;
            fetchSampleFile(fileParam);
        }

        // 2. Handle Sample Selection + Update URL
        sampleSelect.addEventListener('change', (e) => {
            const fileName = e.target.value;
            if (fileName) {
                const newUrl = new URL(window.location);
                newUrl.searchParams.set('file', fileName);
                window.history.pushState({}, '', newUrl);

                fetchSampleFile(fileName);
            } else {
                const newUrl = new URL(window.location);
                newUrl.searchParams.delete('file');
                window.history.pushState({}, '', newUrl);
            }
        });

        colorBySelect.addEventListener('change', (e) => {
            visualizeToolpath(e.target.value);
        });

        uploadZone.addEventListener('click', (e) => {
            if (e.target !== sampleSelect && e.target.tagName !== 'OPTION') {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = '#4a9eff';
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.style.borderColor = '#555';
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.style.borderColor = '#555';
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        document.getElementById('reset-view').addEventListener('click', () => {
            visualizeToolpath(colorBySelect.value); // Re-runs the camera centering logic
        });

        document.getElementById('reload-file').addEventListener('click', () => {
            // Clear URL
            const newUrl = new URL(window.location);
            newUrl.searchParams.delete('file');
            window.history.pushState({}, '', newUrl);

            // Reset UI
            uploadZone.classList.remove('hidden');
            controlsDiv.classList.add('hidden');
            fileInput.value = '';
            sampleSelect.value = "";

            if (toolpathGroup) {
                scene.remove(toolpathGroup);
                toolpathGroup = null;
            }
            metadataContainer.innerHTML = '<p style="color: #888; text-align: center;">No file loaded</p>';
            currentToolpathData = null;
            colorBySelect.innerHTML = '<option value="layer">Default</option>';

            if (controls) {
                camera.position.set(500, 500, 500);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = viewerDiv.clientWidth / viewerDiv.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
        });

        initScene();
    </script>
</body>

</html>
